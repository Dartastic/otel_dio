name: otel_dio_example_app
description: Runnable demo of otel_dio against a local OTLP-capable
  backend. Hits a public test endpoint with a handful of request
  shapes — success, 4xx, 5xx, transport failure — so every
  interceptor code path produces visible spans in your tracing UI.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.0.0

dependencies:
  dartastic_opentelemetry: ^1.1.0-beta.12
  dio: ^5.9.0
  otel_dio:
    path: ..

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
