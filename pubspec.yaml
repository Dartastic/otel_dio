name: otel_dio
description: OpenTelemetry instrumentation for `package:dio`. Adds a client
  Interceptor that wraps each HTTP request in a CLIENT-kind span, sets the
  HTTP semantic-convention attributes, and injects W3C trace-context
  headers so backend services join the same trace.
version: 0.1.0-beta.1-wip
repository: https://github.com/dartastic/otel_dio
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  dartastic_opentelemetry: ^1.1.0-beta.4
  dartastic_opentelemetry_api: ^1.0.0-beta.6
  dio: ^5.9.0

dev_dependencies:
  pubspec_parse: ^1.5.0
  pub_semver: ^2.0.0
  dart_flutter_team_lints: ^3.5.2
  test: ^1.26.3
