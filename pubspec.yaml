name: otel_dio
description: >-
  OpenTelemetry instrumentation for dio by Dartastic.io. Adds standard
  OpenTelemetry observability to applications that use dio.
version: 0.3.1-wip
repository: https://github.com/dartastic/otel_dio
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  dartastic_opentelemetry_api: '>=1.0.0-rc.4 <1.0.0-rc.5'
  dio: ^5.9.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  dartastic_opentelemetry: ^1.1.0-beta.17
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
  test: ^1.26.3
