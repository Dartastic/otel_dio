name: otel_dio
description: >-
  OpenTelemetry instrumentation for `package:dio`. An Interceptor that wraps
  each request in a CLIENT-kind span, sets HTTP semconv attributes and
  injects W3C trace-context headers.
version: 0.2.0-wip
repository: https://github.com/dartastic/otel_dio
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  dartastic_opentelemetry: ^1.1.0-beta.12
  dartastic_opentelemetry_api: ^1.0.0-rc.1
  dio: ^5.9.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
  test: ^1.26.3
